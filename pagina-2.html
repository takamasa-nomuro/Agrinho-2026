<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Pegada de Carbono</title>
    <script src="main.js"></script>
    <link rel="stylesheet" href="pagina-2.css">
</head>
<body>

    <!--calculadora de carbono-->

<div class="container">
    <h1>🌱 Calculadora de Pegada de Carbono</h1>

    <label for="carro">Km percorridos de carro por mês:</label>
    <input type="number" id="carro" placeholder="Ex: 500">

    <label for="energia">Consumo de energia (kWh/mês):</label>
    <input type="number" id="energia" placeholder="Ex: 200">

    <button onclick="calcular()">Calcular</button>

    <div class="resultado">
        <h2>Resultado</h2>
        <p id="co2">CO₂ emitido: 0 kg</p>
        <p id="arvores">Árvores necessárias: 0</p>
    </div>
</div>

       <a href="index.html" class="voltar">Voltar para a Página Principal</a>


</body>
</html>
